name: Feature Request
description: Suggest a new biome, enemy archetype, power-up, audio track, or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **Pixel Stride** even more fun? Share the details below!

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Describe the feature or improvement you'd like to see.
      placeholder: What should be added or improved?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why would this be awesome?
      description: Explain how this improves gameplay, visuals, audio, or developer experience.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Proposed Design / Mechanics
      description: Optional notes on controls, balancing, pixel-art palette, or technical implementation.

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I would be happy to submit a Pull Request for this feature.
