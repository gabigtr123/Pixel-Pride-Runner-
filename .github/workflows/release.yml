name: Release (Android 17 + Web)

on:
  push:
    tags:
      - "v*"
      - "!v*-alpha*"
      - "!v*-beta*"
      - "!v*-rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1)"
        required: true
        default: "v1.3.1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test Web/PWA
        run: |
          npm run lint
          npm test

      - name: Build Web & PWA bundle
        run: npm run build

      - name: Package Web release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd dist
          zip -r "../pixel-stride-${RELEASE_TAG}-web.zip" .

      - name: Run Native Kotlin Unit Tests & Build Signed Android 17 APK (Zero WebView)
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android-native/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android-native
          gradle testDebugUnitTest assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-android.apk"

      - name: Verify APK signature & Android 17 metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "pixel-stride-${RELEASE_TAG}-android.apk"
          "$BUILD_TOOLS/aapt2" dump badging "pixel-stride-${RELEASE_TAG}-android.apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:)"

      - name: Publish Unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-android.apk"
          ZIP="pixel-stride-${RELEASE_TAG}-web.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$ZIP" --clobber
          else
            printf '%s\n' \
              "Unified **100% Native Android 17 (Zero WebView)** & **Web/PWA** release of **Pixel Stride ${RELEASE_TAG}**." \
              "" \
              "### Downloads" \
              "- **Android 17 Signed Native APK (~790 KB, Zero WebView):** \`${APK}\` (Package ID: \`com.gabigtr123.pixelstride\` — upgrades cleanly in-place over \`v3.0.3\` with the same release keystore!)" \
              "- **Web & PWA Bundle:** \`${ZIP}\` (static bundle ready for any host)" \
              "- **Play / Install PWA:** https://gabigtr123.github.io/Pixel-Pride-Runner-/" \
              "" \
              "### What's New in v4.0.0 (100% Native Kotlin / Zero WebView GA)" \
              "- **Zero WebView, Zero Capacitor — Pure Kotlin Android 17 Engine:** Dedicated \`SurfaceView\` 60 FPS loop, R8-minified **~790 KB** APK, native Android 12–17 Dark SplashScreen, Predictive Back, Game Mode (\`appCategory=\"game\"\`), and immersive edge-to-edge display." \
              "- **1:1 v3.0.3 Pixel-Art Graphics Parity:** Exact hex palettes for all 6 Biomes + dedicated \`WINTER_BIOME_PALETTE\`, 4 stepped pixel-art landscapes (Highland Meadows, Pyramid Canyon, Starlight City, Crystal Peaks), 16px NES ground & floating platform masonry with rain puddles/trickles & snow icicles, orbiting 4-star Shield, Turbo/Magnet/Boss FX, and bundled \`Press Start 2P\` + \`Silkscreen\` fonts." \
              "- **Full Gameplay, Audio, Pets & Live Weather Parity:** Floating platforms with one-way landing & drop-through, Swooper/Flame/Hopper telegraphs & upside-down KO topple, Combo Multiplier (\`x1..x8\`), Level/Biome banners, \`DAILY SEED\` mode + \`❄ WINTER\` theme toggle, 6 biome chiptune music loops + Boss theme + 4-channel polyphonic SFX via \`AudioTrack\`, 3 Pet Companions (Fox, Owl, Mini Dragon), and Open-Meteo Live Weather + single-shot native Android GPS." \
              "- **Full Meta-Progression & Controls Parity:** Pixel Shop 2.0 (Hats, Capes/Wings, Pets, Runner Trails, 2+1 Gadget Slots, Boosters, Permanent Upgrades LV 0–3, Local Top-5), Hero Creator, Daily Missions + 7-Day Streak, Trophy Room (12 Achievements), Graphical \`640×900\` Run Card PNG (Share & Save to Gallery), and Hardware Keyboard + Bluetooth Gamepad support." \
              "- **Automated Quality Gates in CI:** Verified with 26 Web/TypeScript unit tests + JUnit 4 Kotlin \`GameEngineTest\` suite before every release." \
              > release-notes.md
            gh release create "$RELEASE_TAG" "$APK" "$ZIP" \
              --title "Pixel Stride ${RELEASE_TAG} (Native Android 17 + Web)" \
              --notes-file release-notes.md
          fi
