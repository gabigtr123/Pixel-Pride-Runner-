name: Release (Android 17 + Web)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1)"
        required: true
        default: "v1.3.1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test
        run: |
          npm run lint
          npm test

      - name: Build Web & PWA bundle
        run: npm run build

      - name: Package Web release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd dist
          zip -r "../pixel-stride-${RELEASE_TAG}-web.zip" .

      - name: Add and sync Capacitor 9 Android project (Android 17 / API 37)
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-icons.mjs
          cat android/variables.gradle

      - name: Build Signed Android 17 Release APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-android.apk"

      - name: Verify APK signature
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "pixel-stride-${RELEASE_TAG}-android.apk"

      - name: Publish Unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-android.apk"
          ZIP="pixel-stride-${RELEASE_TAG}-web.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$ZIP" --clobber
          else
            printf '%s\n' \
              "Unified **Android 17** & **Web/PWA** release of **Pixel Stride ${RELEASE_TAG}**." \
              "" \
              "### Downloads" \
              "- **Android 17 Signed APK:** \`${APK}\` (API 37 / Capacitor 9, persistent release keystore for seamless in-place updates)" \
              "- **Web & PWA Bundle:** \`${ZIP}\` (static bundle ready for any host)" \
              "- **Play / Install PWA (0 warnings):** https://gabigtr123.github.io/Pixel-Pride-Runner-/" \
              "" \
              "### What's New in v3.0" \
              "- **4 Retro Mini-Boss Encounters (Every 90s + Boss Rush):** Battle **Iron Beetle** (LV 2), **Sand Golem** (LV 3), **Neon Drone** (LV 4), and **Crystal Wyrm** (LV 5+) with a live Boss HP bar, charge-and-recoil attacks, flashing charge telegraphs, dedicated chiptune boss battle music, and **+500 BOSS KO! +25 COINS** + free Heart/Shield drop!" \
              "- **3 Pet Companions (Pixel Shop Wardrobe):**" \
              "  - **Pixel Fox (300 C)** — Hops alongside you and fetches nearby coins (\`95px\` pull radius)." \
              "  - **Frost Owl (380 C)** — Hovers overhead and grants \`+10%\` bonus score on everything." \
              "  - **Mini Dragon (550 C)** — Zaps 1 visible hazard ahead every \`20s\` for \`+75 ZAP!\`." \
              "- **4 Game Modes:** **ENDLESS** (boss every 90s), **DAILY** (deterministic daily seed), **HARDCORE** (\`1 HP\`, \`1.25×\` speed, **2× Coins & Score**), and **BOSS RUSH** (back-to-back bosses)." \
              "- **Trophy Room (12 Achievements + Career Stats):** Unlock 12 milestones with claimable \`+50 C\` to \`+200 C\` coin rewards, instant Game Over unlock banners, and a full Career Stats board." \
              "- **Graphical Trading-Card Run Card (PNG):** Tap **VIEW & SHARE RUN CARD** on Game Over to generate a crisp \`640×900\` 8-bit collector's trading card PNG (\`COMMON\` / \`RARE\` / \`EPIC\` / \`LEGENDARY\` rarity border with holographic sparkles, hero + equipped Hat, Cape/Wings & Pet) with 1-tap **Share PNG** or **Save PNG**." \
              "" \
              "### Core Highlights" \
              "- **Pixel Shop 2.0:** Wardrobe (5 Hats + Cape/Jetpack/Angel Wings), 5 Equippable Gadgets (2 slots + unlockable Slot #3), 3 Consumable Boosters & **Turbo Dash** power-up." \
              "- **4 Looping Landscape Levels** (Highland Meadows -> Pyramid Canyon -> Starlight City -> Crystal Peaks), **Winter Theme**, **Day/Night Cycle**, and **Live Weather Sync** with weather-reactive terrain." \
              "- **4 Playable Heroes:** **Stride**, **Lily**, **Pixel Knight**, and **Custom Hero** (8-bit Hero Creator)." \
              > release-notes.md
            gh release create "$RELEASE_TAG" "$APK" "$ZIP" \
              --title "Pixel Stride ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
