name: Release (Android 17 + Web)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1)"
        required: true
        default: "v1.3.1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test
        run: |
          npm run lint
          npm test

      - name: Build Web & PWA bundle
        run: npm run build

      - name: Package Web release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd dist
          zip -r "../pixel-stride-${RELEASE_TAG}-web.zip" .

      - name: Add and sync Capacitor 9 Android project (Android 17 / API 37)
        run: |
          npx cap add android
          npx cap sync android
          node scripts/apply-android-icons.mjs
          node scripts/configure-android-manifest.mjs
          cat android/app/src/main/AndroidManifest.xml
          cat android/variables.gradle

      - name: Build Signed Android 17 Release APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-android.apk"

      - name: Verify APK signature & Android 17 metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "pixel-stride-${RELEASE_TAG}-android.apk"
          "$BUILD_TOOLS/aapt2" dump badging "pixel-stride-${RELEASE_TAG}-android.apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:)"

      - name: Publish Unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-android.apk"
          ZIP="pixel-stride-${RELEASE_TAG}-web.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$ZIP" --clobber
          else
            printf '%s\n' \
              "Unified **Android 17** & **Web/PWA** release of **Pixel Stride ${RELEASE_TAG}**." \
              "" \
              "### Downloads" \
              "- **Android 17 Signed APK:** \`${APK}\` (API 37 / Capacitor 9, persistent release keystore for seamless in-place updates)" \
              "- **Web & PWA Bundle:** \`${ZIP}\` (static bundle ready for any host)" \
              "- **Play / Install PWA (0 warnings):** https://gabigtr123.github.io/Pixel-Pride-Runner-/" \
              "" \
              "### What's New in v3.0.3 (Android 17 / API 37 Polish)" \
              "- **Proper Android Versioning & Explicit API 37 Target:** Synced \`versionName\` (\`3.0.3\`), \`versionCode\` (\`30003\`), and explicit \`targetSdkVersion 37\` in \`app/build.gradle\` (previously stuck at \`1.0\` / \`versionCode 1\`), verified automatically via \`aapt2 dump badging\` in CI." \
              "- **Android 15–17 Game Mode & Predictive Back:** Added \`android:appCategory=\"game\"\` (unlocks Android Game Dashboard / Game Mode), \`android:enableOnBackInvokedCallback=\"true\"\` (Predictive Back gesture), and \`android:usesCleartextTraffic=\"false\"\` (HTTPS-only hardening)." \
              "- **Native Android 12–17 Dark SplashScreen & Cutout Edge-to-Edge:** Replaced default Capacitor splash with Pixel Stride's dark \`#111324\` \`Theme.SplashScreen\` + adaptive pixel runner icon and \`windowLayoutInDisplayCutoutMode=\"always\"\` (zero white flash on launch)." \
              "" \
              "### Included from v3.0.1 – v3.0.2" \
              "- **Native Android GPS Weather Permission (\`@capacitor/geolocation\`):** Native Android runtime location permission prompt (Approximate & Precise) for Live Weather Sync." \
              "- **Native Android Run Card PNG (\`@capacitor/share\` + \`@capacitor/filesystem\`):** Native Share Sheet + direct save to \`Documents/PixelStride/\`." \
              "" \
              "### v3.0 Highlights" \
              "- **4 Retro Mini-Boss Encounters (Every 90s + Boss Rush):** Battle **Iron Beetle** (LV 2), **Sand Golem** (LV 3), **Neon Drone** (LV 4), and **Crystal Wyrm** (LV 5+) with a live Boss HP bar, charge-and-recoil attacks, flashing charge telegraphs, dedicated chiptune boss battle music, and **+500 BOSS KO! +25 COINS** + free Heart/Shield drop!" \
              "- **3 Pet Companions (Pixel Shop Wardrobe):** **Pixel Fox**, **Frost Owl**, and **Mini Dragon**." \
              "- **4 Game Modes:** **ENDLESS**, **DAILY**, **HARDCORE** (\`1 HP\`, \`1.25×\` speed, **2× Coins & Score**), and **BOSS RUSH**." \
              "- **Trophy Room (12 Achievements + Career Stats):** Claimable \`+50 C\` to \`+200 C\` rewards & Game Over unlock banners." \
              "- **Graphical Trading-Card Run Card (PNG):** \`640×900\` 8-bit collector's trading card (\`COMMON\` / \`RARE\` / \`EPIC\` / \`LEGENDARY\` with holographic sparkles) with 1-tap **Share PNG** or **Save PNG** on both Web/PWA and Android APK." \
              > release-notes.md
            gh release create "$RELEASE_TAG" "$APK" "$ZIP" \
              --title "Pixel Stride ${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
