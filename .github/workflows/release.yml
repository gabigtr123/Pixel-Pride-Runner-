name: Release (Android 17 + Web)

on:
  push:
    tags:
      - "v*"
      - "!v*-alpha*"
      - "!v*-beta*"
      - "!v*-rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1)"
        required: true
        default: "v1.3.1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test Web/PWA
        run: |
          npm run lint
          npm test

      - name: Build Web & PWA bundle
        run: npm run build

      - name: Package Web release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd dist
          zip -r "../pixel-stride-${RELEASE_TAG}-web.zip" .

      - name: Run Native Kotlin Unit Tests & Build Signed Android 17 APK (Zero WebView)
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android-native/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android-native
          gradle testDebugUnitTest assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../pixel-stride-${RELEASE_TAG}-android.aab"

      - name: Verify APK signature & Android 17 metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "pixel-stride-${RELEASE_TAG}-android.apk"
          "$BUILD_TOOLS/aapt2" dump badging "pixel-stride-${RELEASE_TAG}-android.apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:)"

      - name: Publish Unified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-android.apk"
          AAB="pixel-stride-${RELEASE_TAG}-android.aab"
          ZIP="pixel-stride-${RELEASE_TAG}-web.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$AAB" "$ZIP" --clobber
          else
            printf '%s\n' \
              "Unified **100% Native Android 17 (Zero WebView)** & **Web/PWA** release of **Pixel Stride ${RELEASE_TAG}**." \
              "" \
              "### Downloads" \
              "- **Android 17 Signed Native APK (~790 KB, Zero WebView):** \`${APK}\` (Package ID: \`com.gabigtr123.pixelstride\` — upgrades cleanly in-place over \`v3.0.3\` / \`v4.0.0\`!)" \
              "- **Google Play Android App Bundle (Signed AAB):** \`${AAB}\` (ready for Play Console upload)" \
              "- **Web & PWA Bundle:** \`${ZIP}\` (static bundle ready for any host)" \
              "- **Play / Install PWA:** https://gabigtr123.github.io/Pixel-Pride-Runner-/" \
              "" \
              "### What's New in v4.2.3 (Exhaustive Deep Bug-Fix & Stability Release — 22 Fixes)" \
              "- **Audio & Thread-Safety (3 Fixes):** Generation counters (\`musicGen\` / \`sfxGen\`) eliminate overlapping music resurrection on rapid Pause/Resume with \`0ms\` UI stall; \`PixelSprites\` cache & \`ThreadLocal\` \`Paint\`/\`RectF\` prevent concurrent access races during background Run Card export; hoisted \`NINJA_PALETTE\`, \`ASTRO_PALETTE\`, and cached \`CustomHeroConfig\` palettes eliminate 240+ \`LinkedHashMap\` allocations/sec." \
              "- **Landscape UI, Camera Cutouts & Multi-Touch (4 Fixes):** Adaptive 2-column Landscape Arcade Title Deck + proportional scaling across all 8 modals (zero overflow in Landscape & Split-Screen); \`insetLeftPx\` / \`insetRightPx\` cutout safety for HUD & touch pads; \`buttons.clear()\` + \`lastOrNull\` prevents Pause tap-through; \`ACTION_CANCEL\` cleanly releases all multi-touch pointers." \
              "- **Boss Combat & Physics (5 Fixes):** \`0.35s\` grace invulnerability on Boss stomp prevents phantom bounce contact damage; centered \`BossProjectile\` AABB matches visual orb 1:1; ground bosses (\`IRON_BEETLE\`, \`SAND_GOLEM\`) stand flush on \`groundY\`; \`!onPlatform\` guard on \`setDuck(false)\`; trail particles routed through \`MAX_PARTICLES\` with zero-allocation backwards index loops." \
              "- **Shop, Trophies & Save Code (4 Fixes):** Fixed \`PET KEEPER\` unlocking prematurely on Run #1 without adopting a pet (Fox remains \`FREE\` in Shop); \`STYLE ICON\` now counts owned Trails; \`HARDCORE\` mode no longer wastes \`HEART FLASK\` boosters; \`PS4:\` Save Codes preserve Hero, Pet & Mode." \
              "- **Run Card I/O, GPS Weather & RO Localization (6 Fixes):** Offloaded PNG compression & MediaStore/FileProvider I/O off the UI thread with \`finally\` bitmap recycling, pending-URI cleanup, cache pruning & \`Winter Theme\` support; \`10s\` indoor GPS timeout + \`requestSeq\` race protection in \`WeatherService\`; expanded Romanian (\`RO\`) localization across all modals." \
              "- **Verified Quality:** Gated by 26 Web/TS tests and 19 Kotlin JUnit 4 unit tests." \
              > release-notes.md
            gh release create "$RELEASE_TAG" "$APK" "$AAB" "$ZIP" \
              --title "Pixel Stride ${RELEASE_TAG} (Native Android 17 + Web)" \
              --notes-file release-notes.md
          fi
