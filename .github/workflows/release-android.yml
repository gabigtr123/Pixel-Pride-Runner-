name: Release Android

on:
  push:
    tags:
      - "v*-android"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0-android)"
        required: true
        default: "v1.0.0-android"

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test
        run: |
          npm run lint
          npm test

      - name: Build Web bundle
        run: npm run build

      - name: Add and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../pixel-stride-${RELEASE_TAG}.apk"

      - name: Publish Android GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "pixel-stride-${RELEASE_TAG}.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "pixel-stride-${RELEASE_TAG}.apk" \
              --title "Pixel Stride Android (${RELEASE_TAG})" \
              --notes "Android APK build of **Pixel Stride** packaged with Capacitor 8.

### How to install
1. Download \`pixel-stride-${RELEASE_TAG}.apk\` on your Android device.
2. Allow installing apps from unknown sources if prompted, then tap the APK to install."
          fi
