name: Release Android

on:
  push:
    tags:
      - "v*-android"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0-android)"
        required: true
        default: "v1.1.0-android"

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test
        run: |
          npm run lint
          npm test

      - name: Build Web bundle
        run: npm run build

      - name: Add and sync Capacitor 9 Android project (Android 17 / API 37)
        run: |
          npx cap add android
          npx cap sync android
          cat android/variables.gradle

      - name: Build Android 17 APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../pixel-stride-${RELEASE_TAG}.apk"

      - name: Publish Android GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "pixel-stride-${RELEASE_TAG}.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "pixel-stride-${RELEASE_TAG}.apk" \
              --title "Pixel Stride Android 17 (${RELEASE_TAG})" \
              --notes "$(printf 'Android 17 (API level 37) APK build of **Pixel Stride** packaged with Capacitor 9.\n\n### What is new for Android 17\n- Targets **Android 17 (API 37)** (`compileSdkVersion = 37`, `targetSdkVersion = 37`)\n- Edge-to-edge full-screen rendering with safe-area insets (`viewport-fit=cover` + `env(safe-area-inset-*)`)\n- Adaptive large-screen / tablet / foldable touch controls (`pointer: coarse`)\n- Background audio hardening: auto-pauses gameplay and stops chiptune audio when backgrounded\n\n### How to install\n1. Download `pixel-stride-%s.apk` on your Android device.\n2. Allow installing apps from unknown sources if prompted, then tap the APK to install.' "$RELEASE_TAG")"
          fi
