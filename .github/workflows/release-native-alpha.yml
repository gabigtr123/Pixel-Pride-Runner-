name: Release Native (Android 17 Kotlin / Zero WebView)

on:
  push:
    tags:
      - "v*-alpha*"
      - "v*-beta*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag (e.g. v4.0.0-beta.1)"
        required: true
        default: "v4.0.0-beta.1"

permissions:
  contents: write

jobs:
  build-native-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build Signed Native Android 17 Alpha APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android-native/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android-native
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-native-android.apk"

      - name: Verify APK signature & Android 17 metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK="pixel-stride-${RELEASE_TAG}-native-android.apk"
          ls -lh "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:)"

      - name: Publish GitHub Pre-Release (Native Alpha)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-native-android.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            printf '%s\n' \
              "First **100% Native Kotlin / Android 17 (API 37)** Alpha release of **Pixel Stride** — **Zero WebView, Zero Capacitor, Zero JavaScript**." \
              "" \
              "### Downloads" \
              "- **Native Android 17 Signed APK (Alpha):** \`${APK}\` (Package ID: \`com.gabigtr123.pixelstride.nativealpha\` — installs side-by-side alongside v3.0.3 without overwriting your saves!)" \
              "" \
              "### What's New in v4.0.0-beta.1 (Milestone 3: Full Meta-Progression Parity)" \
              "- **Pixel Shop 2.0 (4 Tabs: Wardrobe, Gadgets, Boosts, Top 5):**" \
              "  - **Wardrobe:** 5 Hats (Crown, Wizard, Santa, Visor, Halo), 3 Back Gear (Hero Cape, Jetpack, Angel Wings), and 3 Pet Companions (Pixel Fox, Frost Owl, Mini Dragon) — rendered live in gameplay AND on the \`640×900\` Run Card PNG!" \
              "  - **5 Equippable Gadgets** (2 slots + unlockable Slot #3 for \`400 C\`): Feather Boots (Triple Jump), Phoenix Charm (Second Wind 1× Revive), Magnet Ring (\`80px\` pull), Golden Emblem (\`+15%\` score), Aegis Buckle (Start Shield)." \
              "  - **3 Consumable Boosters:** Turbo Start (\`4.5s\` Turbo Dash), Heart Flask (\`+1\` Max HP), 2X Coins Run." \
              "  - **Local Top-5 Leaderboard:** Tracks your top 5 runs with hero, mode, and date." \
              "- **Hero Creator (\`CUSTOM\` Hero):** Customize Hair/Cap, Tunic, Scarf, and Boots colors with live animated preview — playable in-game and rendered on Run Card PNGs." \
              "- **Daily Missions & 7-Day Login Streak:** 3 deterministic daily quests with progress bars & claimable coin rewards, plus 7-day streak perks (Day 2 \`+150\` score, Day 3 free Star Shield, Day 5 Coin Magnet)." \
              "- **Trophy Room (12 Achievements + Career Stats):** 12 claimable milestones (\`+50 C\` to \`+200 C\`), Career Stats bar, and instant **🏆 TROPHY UNLOCKED!** Game Over banner." \
              > release-notes-alpha.md
            gh release create "$RELEASE_TAG" "$APK" \
              --title "Pixel Stride Native ${RELEASE_TAG} (Zero WebView Beta)" \
              --notes-file release-notes-alpha.md \
              --prerelease
          fi
