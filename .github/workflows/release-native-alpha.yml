name: Release Native Alpha (Android 17 Kotlin / Zero WebView)

on:
  push:
    tags:
      - "v*-alpha*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Alpha release tag (e.g. v4.0.0-alpha.1)"
        required: true
        default: "v4.0.0-alpha.1"

permissions:
  contents: write

jobs:
  build-native-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build Signed Native Android 17 Alpha APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android-native/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android-native
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-native-android.apk"

      - name: Verify APK signature & Android 17 metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK="pixel-stride-${RELEASE_TAG}-native-android.apk"
          ls -lh "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:)"

      - name: Publish GitHub Pre-Release (Native Alpha)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-native-android.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            printf '%s\n' \
              "First **100% Native Kotlin / Android 17 (API 37)** Alpha release of **Pixel Stride** — **Zero WebView, Zero Capacitor, Zero JavaScript**." \
              "" \
              "### Downloads" \
              "- **Native Android 17 Signed APK (Alpha):** \`${APK}\` (Package ID: \`com.gabigtr123.pixelstride.nativealpha\` — installs side-by-side alongside v3.0.3 without overwriting your saves!)" \
              "" \
              "### What's New in v4.0.0-alpha.2 (Milestone 1: Graphics, Fonts & UI Parity)" \
              "- **Real Bundled Pixel Fonts (\`Press Start 2P\` + \`Silkscreen\`):** Bundled both authentic Pixel Stride TTF fonts natively in \`res/font/\` for crisp 8-bit headings, HUD, modals, and Run Card PNGs." \
              "- **100% Exact \`v3.0.3\` Pixel-Art Sprites:** Ported every hand-crafted 16×19 Hero sprite (Stride, Lily with ponytail & blossom, Pixel Knight), animated Shell Hopper & Sky Swooper, Spike Totem, 4-frame spinning Gold Coins, all 6 Power-Up sprites, and all 4 Mini-Bosses (Iron Beetle, Sand Golem, Neon Drone, Crystal Wyrm)." \
              "- **Exact Beveled 8-Bit UI & Hero Selector Cards:** Authentic \`.pixel-panel\`, golden \`.pixel-btn-primary\`, navy \`.pixel-btn-secondary\`, Title Screen with 3 live animated Hero Cards + perks (+25% Stomp for Stride, Coin Aura for Lily, 4 HP for Knight), pixel Heart & Shield HUD sprites, and a **live Run Card Trading Card Preview Modal** (with holographic EPIC/LEGENDARY sparkles)." \
              "- **4 Looping Landscape Levels & Winter Icicles:** Highland Meadows -> Pyramid Canyon (stepped pyramids) -> Starlight City (lit pixel skyscrapers) -> Crystal Peaks (glowing crystal spires), plus frosted Winter ledges with hanging pixel icicles & 2-layer snowfall." \
              > release-notes-alpha.md
            gh release create "$RELEASE_TAG" "$APK" \
              --title "Pixel Stride Native ${RELEASE_TAG} (Zero WebView Alpha)" \
              --notes-file release-notes-alpha.md \
              --prerelease
          fi
