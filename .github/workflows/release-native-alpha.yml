name: Release Native Alpha (Android 17 Kotlin / Zero WebView)

on:
  push:
    tags:
      - "v*-alpha*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Alpha release tag (e.g. v4.0.0-alpha.1)"
        required: true
        default: "v4.0.0-alpha.1"

permissions:
  contents: write

jobs:
  build-native-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build Signed Native Android 17 Alpha APK
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$PWD/android-native/app/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          cd android-native
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../pixel-stride-${RELEASE_TAG}-native-android.apk"

      - name: Verify APK signature & Android 17 metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK="pixel-stride-${RELEASE_TAG}-native-android.apk"
          ls -lh "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label:)"

      - name: Publish GitHub Pre-Release (Native Alpha)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          APK="pixel-stride-${RELEASE_TAG}-native-android.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            printf '%s\n' \
              "First **100% Native Kotlin / Android 17 (API 37)** Alpha release of **Pixel Stride** — **Zero WebView, Zero Capacitor, Zero JavaScript**." \
              "" \
              "### Downloads" \
              "- **Native Android 17 Signed APK (Alpha):** \`${APK}\` (Package ID: \`com.gabigtr123.pixelstride.nativealpha\` — installs side-by-side alongside v3.0.3 without overwriting your saves!)" \
              "" \
              "### What's New in v4.0.0-alpha.3 (1:1 Visual & Layout Parity Pass)" \
              "- **Full-Bleed Edge-to-Edge Viewport (Zero Letterboxing):** Extended sky bands upward & underground pixel masonry downward to fill 100% of tall Android 17 screens, matching \`v3.0.3\` portrait framing (\`groundY = 340\`) so the horizon & running hero stay 100% bright and unobstructed." \
              "- **Exact \`PixelStrideTitleLogo\` Cartridge Plaque:** Coordinate-for-coordinate native port of the beveled navy cartridge plaque with flowing crimson scarf tails, golden corner rivets, gold \`PIXEL\` and cream \`STRIDE\`." \
              "- **Exact \`TitleOverlay\` Layout (Zero Dark Scrim):** Logo anchored cleanly in the upper sky, live running hero across the sunlit middle horizon, and compact Hero selector pills + PERK badge + 4-Mode pills + golden \`START RUN\` button cleanly on the lower underground masonry deck." \
              "- **Authentic Stepped 8-Bit Sky Bands + Dither Seams:** Replaced smooth gradient with \`v3.0.3\`'s 3-band NES sky + 2px pixel dither seams, golden-coral sunset/dawn glow, twinkling stars, and pixel crescent moon." \
              > release-notes-alpha.md
            gh release create "$RELEASE_TAG" "$APK" \
              --title "Pixel Stride Native ${RELEASE_TAG} (Zero WebView Alpha)" \
              --notes-file release-notes-alpha.md \
              --prerelease
          fi
