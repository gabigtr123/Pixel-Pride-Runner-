name: Release Web

on:
  push:
    tags:
      - "v*-web"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1-web)"
        required: true
        default: "v1.3.1-web"

permissions:
  contents: write

jobs:
  build-and-release-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Test
        run: |
          npm run lint
          npm test

      - name: Build Web PWA bundle
        run: npm run build

      - name: Package Web release archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cd dist
          zip -r "../pixel-stride-${RELEASE_TAG}.zip" .

      - name: Publish Web GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "pixel-stride-${RELEASE_TAG}.zip" --clobber
          else
            gh release create "$RELEASE_TAG" "pixel-stride-${RELEASE_TAG}.zip" \
              --title "Pixel Stride Web & PWA (${RELEASE_TAG})" \
              --notes "$(printf 'Static Web & installable PWA production build of **Pixel Stride**.\n\n### Play / Install on Android with Zero Warnings\nOpen https://gabigtr123.github.io/Pixel-Pride-Runner-/ in Chrome and tap **Install app / Add to Home screen** for a full-screen offline experience with automatic updates.\n\n### Self-hosting\nDownload and unzip `pixel-stride-%s.zip` and serve with any static host.' "$RELEASE_TAG")"
          fi
